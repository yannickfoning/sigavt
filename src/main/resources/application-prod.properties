# ══════════════════════════════════════════════════════
# SIGAVT — Profil PRODUCTION (Cameroun)
# Utiliser avec : java -jar sigavt.jar --spring.profiles.active=prod
# Variables d'environnement requises : DB_HOST, DB_NAME, DB_USER,
#                                      DB_PASSWORD, JWT_SECRET
# ══════════════════════════════════════════════════════

# ── Serveur ──
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ── Base de données ──
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sigavt}?useSSL=false&serverTimezone=Africa/Douala&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala

# ── Flyway ──
spring.flyway.enabled=false

# ── JWT ──
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

# ── CORS ──
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sigavt.cm}

# ── Logging ──
logging.level.root=WARN
logging.level.com.sigavt=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.file.name=/var/log/sigavt/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Actuator ──
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=SIGAVT
info.app.description=Système de Gestion d'Agence de Voyage Terrestre — Cameroun
info.app.version=1.0.0

# ── Upload ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Compression réponses HTTP ──
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ── Seed données de démo ──
# Mettre à false en production si les données sont déjà en place
app.data.seed-on-startup=false
