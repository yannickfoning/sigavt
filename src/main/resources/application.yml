server:
  port: 8081
  error:
    whitelabel:
      enabled: false
    path: /error
    include-stacktrace: never
    include-exception: false
    include-message: never

spring:
  application:
    name: sigavt
  profiles:
    active: disabled

  datasource:
    url: jdbc:mysql://localhost:3306/sigavt?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Douala&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
    show-sql: true

  jackson:
    time-zone: Africa/Douala
    date-format: yyyy-MM-dd
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  data:
    seed-on-startup: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sigavt: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
