server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    path: /error
    include-stacktrace: never
    include-exception: false
    include-message: never

spring:
  application:
    name: sigavt
  profiles:
    active: mysql

  jackson:
    time-zone: Africa/Douala
    date-format: yyyy-MM-dd
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  data:
    seed-on-startup: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sigavt: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
