server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    path: /error
    include-stacktrace: never
    include-exception: false
    include-message: never

spring:
  application:
    name: sigavt
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:sigavt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false

  jackson:
    time-zone: Africa/Douala
    date-format: yyyy-MM-dd

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:aG9zdC1zZWNyZXQtc2lnYXZ0LXByb2R1Y3Rpb24tMjAyNS1zdHJvbmctcmFuZG9tLWtleS0yNTYtYml0cy1mb3Itand0LXRva2VuLXNpZ25pbmc=}
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.sigavt: INFO
    org.hibernate.SQL: WARN
