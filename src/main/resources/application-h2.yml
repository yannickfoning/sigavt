spring:
  datasource:
    url: jdbc:h2:file:./sigavt;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

app:
  data:
    seed-on-startup: true

# WARNING: H2 profile is for local development only
# NEVER use in production - use mysql profile instead
